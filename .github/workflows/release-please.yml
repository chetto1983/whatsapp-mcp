name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-release-image:
    name: Publish Release Image
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # release-please creates the tag with GITHUB_TOKEN, and a tag pushed by
      # that token does not start a workflow run — so publish-image.yml never
      # saw the release. workflow_dispatch is one of the two events exempt from
      # that rule, so dispatching it here builds the tag without needing a PAT.
      - name: Build the image for the release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed as an environment variable rather than interpolated into the
          # run block: an expression expanded inline is substituted before the
          # shell parses the line, so any metacharacter in the value would be
          # executed rather than quoted.
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh workflow run publish-image.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG_NAME"

  publish-release-assets:
    name: Publish Release Artifacts
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v7

      - name: Validate version consistency
        run: python .github/scripts/check_versions.py --tag "${{ needs.release-please.outputs.tag_name }}"

      - name: Build release artifacts
        run: |
          mkdir -p dist

          cd whatsapp-bridge
          GOOS=linux GOARCH=amd64 go build -o ../dist/whatsapp-bridge-linux-amd64 .
          cd ..

          cd whatsapp-mcp-server
          uv build --out-dir ../dist
          cd ..

          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: dist/*
          fail_on_unmatched_files: true
          overwrite_files: true
