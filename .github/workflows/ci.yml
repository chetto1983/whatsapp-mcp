name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  version-consistency:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate project versions are in sync
        run: python .github/scripts/check_versions.py

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install the locked dependencies
        run: |
          cd whatsapp-mcp-server
          uv sync --frozen --extra dev
      - name: Run ruff check
        run: |
          cd whatsapp-mcp-server
          uv run --frozen --extra dev ruff check .
      - name: Run ruff format check
        run: |
          cd whatsapp-mcp-server
          uv run --frozen --extra dev ruff format --check .

  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: whatsapp-bridge/go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: whatsapp-bridge

  go-build:
    name: Go Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: whatsapp-bridge/go.mod
      - name: Build
        run: |
          cd whatsapp-bridge
          go build -v ./...
      - name: Test
        run: |
          cd whatsapp-bridge
          go test ./...

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install the locked dependencies
        run: |
          cd whatsapp-mcp-server
          uv sync --frozen --extra dev
      - name: Run tests
        run: |
          cd whatsapp-mcp-server
          uv run --frozen --extra dev pytest -v
