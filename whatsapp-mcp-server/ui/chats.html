<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WhatsApp</title>
    <style>
      /*{{THEME}}*/

      body {
        background: var(--color-background-secondary, var(--wa-panel));
      }

      .search {
        padding: 7px calc(12px + var(--safe-right)) 7px calc(12px + var(--safe-left));
        background: var(--color-background-secondary, var(--wa-panel));
        border-bottom: 1px solid var(--color-border-primary, var(--wa-divider));
      }

      .search input {
        width: 100%;
        padding: 8px 14px;
        font: inherit;
        font-size: 14px;
        color: var(--color-text-primary, var(--wa-text));
        background: color-mix(in srgb, var(--wa-muted) 12%, transparent);
        border: 0;
        border-radius: 8px;
      }

      .search input:focus {
        outline: 2px solid color-mix(in srgb, var(--wa-accent) 55%, transparent);
        outline-offset: -2px;
      }

      .index {
        list-style: none;
        margin: 0;
        padding: 0;
        background: var(--color-background-secondary, var(--wa-panel));
      }

      .entry {
        display: grid;
        grid-template-columns: auto 1fr;
        grid-template-rows: auto auto;
        column-gap: 13px;
        align-items: center;
        padding: 0 calc(14px + var(--safe-right)) 0 calc(13px + var(--safe-left));
        cursor: pointer;
        transition: background-color 120ms ease;
      }

      .entry:hover,
      .entry:focus-visible {
        outline: none;
        background: color-mix(in srgb, var(--wa-muted) 11%, transparent);
      }

      .entry .avatar {
        grid-row: 1 / 3;
        width: 49px;
        height: 49px;
        font-size: 18px;
      }

      /* The divider starts after the avatar, as WhatsApp's does. */
      .entry .line1,
      .entry .line2 {
        display: flex;
        align-items: baseline;
        gap: 8px;
        min-width: 0;
      }

      .entry .line1 {
        padding-top: 11px;
      }

      .entry .line2 {
        padding-bottom: 11px;
        border-bottom: 1px solid var(--color-border-primary, var(--wa-divider));
        padding-right: 0;
      }

      .entry:last-child .line2 {
        border-bottom: 0;
      }

      .name {
        flex: 1;
        min-width: 0;
        font-size: 16px;
        line-height: 21px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .when {
        flex: none;
        font-size: 12px;
        color: var(--color-text-secondary, var(--wa-muted));
      }

      .preview {
        flex: 1;
        min-width: 0;
        margin-top: 2px;
        font-size: 14px;
        line-height: 20px;
        color: var(--color-text-secondary, var(--wa-muted));
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .preview .ticks {
        margin-right: 4px;
        color: #53bdeb;
      }

      /*
       * A chat whose timestamp has no message behind it. This used to be a blank
       * line, which is how a stale bridge passed for a quiet one; it is named.
       */
      .preview.hollow {
        font-style: italic;
        opacity: 0.85;
      }

      .preview.hollow::before {
        content: "⚠";
        margin-right: 5px;
        font-style: normal;
        color: #e8a33d;
      }

      .badge {
        flex: none;
        font-size: 11px;
        line-height: 16px;
        padding: 0 6px;
        border-radius: 8px;
        background: color-mix(in srgb, var(--wa-accent) 20%, transparent);
        color: var(--wa-accent);
      }

      .toolbar {
        position: sticky;
        bottom: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px calc(14px + var(--safe-right)) calc(10px + var(--safe-bottom)) calc(14px + var(--safe-left));
        background: var(--color-background-secondary, var(--wa-panel));
        border-top: 1px solid var(--color-border-primary, var(--wa-divider));
      }

      .toolbar .count {
        margin-left: auto;
        font-size: 12.5px;
        color: var(--color-text-secondary, var(--wa-muted));
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="grow">
        <h1>Chats</h1>
        <span class="sub" id="subtitle">loading…</span>
      </div>
    </header>

    <div class="search">
      <input id="filter" type="search" placeholder="Search or start a new chat" autocomplete="off" />
    </div>

    <ul class="index" id="index">
      <li class="empty" id="empty">Waiting for the chat list…</li>
    </ul>

    <footer class="toolbar">
      <button id="refresh" disabled>Refresh</button>
      <span class="count" id="count"></span>
    </footer>

    <script>
      /*{{BRIDGE}}*/
    </script>
    <script>
      (function () {
        "use strict";

        const indexEl = document.getElementById("index");
        const emptyEl = document.getElementById("empty");
        const filterEl = document.getElementById("filter");
        const subtitleEl = document.getElementById("subtitle");
        const countEl = document.getElementById("count");
        const refreshBtn = document.getElementById("refresh");

        // The same stable per-name colours the transcript view uses for senders.
        const AVATAR_COLOURS = [
          "#e542a3", "#1f9bcf", "#c4990c", "#e8663d", "#9b6c4a",
          "#6a9c00", "#0aa87f", "#8a6fd0", "#d4483b", "#3f9142",
          "#d1418a", "#2273b8",
        ];

        let toolArgs = {};
        let chats = [];

        function colourFor(key) {
          let hash = 0;
          const text = String(key || "");
          for (let i = 0; i < text.length; i++) hash = (hash * 31 + text.charCodeAt(i)) >>> 0;
          return AVATAR_COLOURS[hash % AVATAR_COLOURS.length];
        }

        function whenOf(value) {
          const at = new Date(value);
          if (isNaN(at)) return "";
          const midnight = new Date();
          midnight.setHours(0, 0, 0, 0);
          const days = Math.round((midnight - new Date(at).setHours(0, 0, 0, 0)) / 86400000);
          if (days <= 0) return at.toTimeString().slice(0, 5);
          if (days === 1) return "yesterday";
          if (days < 7) return at.toLocaleDateString(undefined, { weekday: "long" });
          return at.toLocaleDateString();
        }

        function openChat(chat) {
          const subject = chat.name || chat.jid;
          window.McpApp.sendToChat(
            'Show me the recent messages in the WhatsApp chat "' + subject + '" (jid ' + chat.jid + ").")
            .catch(function (err) {
              window.McpApp.log("error", String((err && err.message) || err));
            });
        }

        /**
         * Names, previews and JIDs are third-party text; every one reaches the DOM as
         * a text node. The JID is never turned into a link this view resolves either.
         */
        function renderEntry(chat, index) {
          const label = chat.name || chat.jid || "unknown";
          const entry = document.createElement("li");
          entry.className = "entry reveal";
          entry.tabIndex = 0;
          entry.style.animationDelay = Math.min(index, 20) * 12 + "ms";

          const face = document.createElement("div");
          face.className = "avatar";
          face.style.backgroundColor = colourFor(chat.jid || label);
          face.textContent = (label.trim()[0] || "?");
          entry.appendChild(face);

          const line1 = document.createElement("div");
          line1.className = "line1";
          const name = document.createElement("div");
          name.className = "name";
          name.textContent = label;
          line1.appendChild(name);
          const when = document.createElement("div");
          when.className = "when";
          when.textContent = whenOf(chat.last_message_time);
          line1.appendChild(when);
          entry.appendChild(line1);

          const line2 = document.createElement("div");
          line2.className = "line2";
          const preview = document.createElement("div");
          const text = (chat.last_message || "").trim();
          if (text) {
            preview.className = "preview";
            if (chat.last_is_from_me) {
              const ticks = document.createElement("span");
              ticks.className = "ticks";
              ticks.textContent = "✓✓";
              preview.appendChild(ticks);
            }
            preview.appendChild(document.createTextNode(text));
          } else if (chat.last_message_time) {
            preview.className = "preview hollow";
            preview.textContent = "active, but no message stored";
          } else {
            preview.className = "preview hollow";
            preview.textContent = "no activity recorded";
          }
          line2.appendChild(preview);
          if (chat.is_group) {
            const badge = document.createElement("span");
            badge.className = "badge";
            badge.textContent = "group";
            line2.appendChild(badge);
          }
          entry.appendChild(line2);

          entry.addEventListener("click", function () {
            openChat(chat);
          });
          entry.addEventListener("keydown", function (event) {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              openChat(chat);
            }
          });
          return entry;
        }

        function render() {
          const needle = filterEl.value.trim().toLowerCase();
          const shown = needle
            ? chats.filter(function (chat) {
                return ((chat.name || "") + " " + (chat.jid || "")).toLowerCase().indexOf(needle) !== -1;
              })
            : chats;

          indexEl.textContent = "";
          if (!shown.length) {
            emptyEl.textContent = chats.length ? "No chats match that search." : "No chats here.";
            indexEl.appendChild(emptyEl);
          } else {
            shown.forEach(function (chat, index) {
              indexEl.appendChild(renderEntry(chat, index));
            });
          }
          const hollow = chats.filter(function (chat) {
            return chat.last_message_time && !(chat.last_message || "").trim();
          }).length;
          countEl.textContent =
            shown.length + " of " + chats.length + (hollow ? " · " + hollow + " with no stored message" : "");
        }

        function adopt(list) {
          if (!Array.isArray(list)) {
            emptyEl.textContent = "The tool returned nothing this view can show.";
            subtitleEl.textContent = "empty";
            return;
          }
          chats = list;
          subtitleEl.textContent = chats.length + " chats";
          refreshBtn.disabled = false;
          render();
        }

        filterEl.addEventListener("input", render);

        refreshBtn.addEventListener("click", async function () {
          refreshBtn.disabled = true;
          subtitleEl.textContent = "loading…";
          try {
            adopt(window.McpApp.payloadOf(await window.McpApp.callTool("list_chats", toolArgs)));
          } catch (err) {
            subtitleEl.textContent = "could not refresh";
            window.McpApp.log("error", String((err && err.message) || err));
          } finally {
            refreshBtn.disabled = false;
          }
        });

        window.McpApp.start({
          name: "WhatsApp chats",
          version: "1.0.0",
          onToolInput: function (params) {
            toolArgs = (params && params.arguments) || {};
          },
          onToolResult: function (result) {
            adopt(window.McpApp.payloadOf(result));
          },
          onToolCancelled: function (params) {
            subtitleEl.textContent = "cancelled";
            emptyEl.textContent = (params && params.reason) || "The tool call was cancelled.";
          },
        }).catch(function (err) {
          subtitleEl.textContent = "no host";
          emptyEl.textContent = "This view could not reach its host: " + String((err && err.message) || err);
        });
      })();
    </script>
  </body>
</html>
