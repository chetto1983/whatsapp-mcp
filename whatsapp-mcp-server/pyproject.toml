[project]
name = "whatsapp-mcp-server"
version = "0.2.1"
description = "WhatsApp integration for Claude via Model Context Protocol (MCP)"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Very Good Plugins", email = "support@verygoodplugins.com" }
]
keywords = ["whatsapp", "mcp", "claude", "ai", "messaging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # mcp 2.0.0 is the SDK for the 2026-07-28 revision: stateless core, the
    # extensions framework, and MCP Apps in `mcp.server.apps`. It removed
    # `mcp.server.fastmcp` outright. The 2.2.0 floor is not merely "newer": it
    # is the release that introduced `AuthSettings.validate_token_resource`,
    # which mcp_security.py's auth_settings() sets explicitly. The SDK
    # provides its own `httpx2` transport client.
    "mcp>=2.2.0",
    "pyjwt[crypto]>=2.13.0",
    "requests>=2.34.2",
    # 627db67 (#44) pinned anyio<4.9 for a real cancel-scope regression that
    # crashed the MCP server at startup; ea5254f (dependabot, #49) widened
    # that to <4.14 without addressing the regression, and the image
    # (Python 3.11) has run the locked 4.9.0 since. 4.14.2 fixes
    # CVE-2026-63374 and CVE-2026-64847; the server starts cleanly on the
    # locked 4.15.1.
    "anyio>=4.14.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.15",
]

[project.urls]
Homepage = "https://github.com/verygoodplugins/whatsapp-mcp"
Repository = "https://github.com/verygoodplugins/whatsapp-mcp"
Issues = "https://github.com/verygoodplugins/whatsapp-mcp/issues"

[tool.setuptools]
py-modules = [
    "apps_ui",
    "audio",
    "main",
    "media_files",
    "mcp_config",
    "mcp_security",
    "store_migration",
    "tenant_context",
    "tenant_gateway",
    "whatsapp",
    "whatsapp_actions",
    "whatsapp_common",
    "whatsapp_query_contacts",
    "whatsapp_query_messages",
]

[tool.mcp]
name = "io.github.verygoodplugins/whatsapp-mcp"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
