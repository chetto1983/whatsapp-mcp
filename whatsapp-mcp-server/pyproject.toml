[project]
name = "whatsapp-mcp-server"
version = "0.2.0"
description = "WhatsApp integration for Claude via Model Context Protocol (MCP)"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Very Good Plugins", email = "support@verygoodplugins.com" }
]
keywords = ["whatsapp", "mcp", "claude", "ai", "messaging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.28.1",
    # mcp 2.0.0 is the SDK for the 2026-07-28 revision: stateless core, the
    # extensions framework, and MCP Apps in `mcp.server.apps`. It removed
    # `mcp.server.fastmcp` outright, so this floor is a requirement, not a
    # preference. `httpx` is gone from this list because nothing here imports it
    # — it was the old SDK's transport dependency, and 2.0.0 brings `httpx2`.
    "mcp>=2.0.0",
    "requests>=2.34.2",
    "anyio<4.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.15",
]

[project.urls]
Homepage = "https://github.com/verygoodplugins/whatsapp-mcp"
Repository = "https://github.com/verygoodplugins/whatsapp-mcp"
Issues = "https://github.com/verygoodplugins/whatsapp-mcp/issues"

[tool.setuptools]
py-modules = ["main", "whatsapp", "audio", "mcp_config", "apps_ui"]

[tool.mcp]
name = "io.github.verygoodplugins/whatsapp-mcp"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
